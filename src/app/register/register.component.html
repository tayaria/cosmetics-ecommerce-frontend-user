<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavir | Responsive eCommerce HTML Template</title>

   
</head>

<body>

    <!-- :::::::::: Start Header Section :::::::::: -->
     <!-- :::::::::: End Header Section :::::::::: -->

    <!-- :::::::::: Start Breadcomb Section :::::::::: -->
    <div id="breadcrumb-section">
        <div class="container-fluid p-lr-80">
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="breadcrumb-title">Page d'inscription</h2>
                   
                </div>
            </div>
        </div>
    </div> <!-- :::::::::: End Breadcomb Section :::::::::: -->
    <!-- :::::::::: Start Register Section :::::::::: -->
    <div class="register-area">
        <div class="container-fluid p-lr-80">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="login-register-wrapper mt-30">
                        <h4 class="title-secondary">Créer un nouveau compte</h4>
                        <p class="m-t-10">Vous avez déjà un compte ? <a href="/login">Connectez-vous !</a></p>

                        <form (ngSubmit)="addNewClient()" [formGroup]="adminForm" class="row g-3">
                            <div class="single-form">
                                <input formControlName="nom" type="text" placeholder="Nom">
                            </div>
                            <div class="single-form">
                                <input formControlName="prenom" type="text" placeholder="Prénom">
                            </div>
                            <div class="single-form">
                                <input formControlName="email" type="email" placeholder="Adresse Email">
                            </div>
                            <div class="single-form">
                                <input formControlName="mdp" type="password" placeholder="Mot De Passe">
                            </div>
                            <div class="single-form">
                                <input formControlName="tele" type="text" placeholder="Téléphone">
                            </div>
                             <div class="single-form">
                                <input formControlName="adresse" type="text" placeholder="Adresse">
                            </div>
                            
                           
                            <div class="single-form">
                                <button class="box-btn" type="submit">Registre</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- :::::::::: Start Register Section :::::::::: -->

    <!-- :::::::::: Start Footer Section :::::::::: -->
    <!-- :::::::::: End Footer Section :::::::::: -->

    <!-- material-scrolltop button -->
    <button class="material-scrolltop" type="button"></button>

    <!-- :::::::::: Javascript Files, jQuery Vendor Plugins ::::::::::  -->
   
</body>
