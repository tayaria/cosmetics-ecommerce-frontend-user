<!DOCTYPE html>
<html lang="zxx">


<!-- Mirrored from htmldemo.net/kavir/kavir/contact.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 06 Aug 2025 11:04:00 GMT -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavir | Responsive eCommerce HTML Template</title>

    <!-- :::::::::: Favicon Icon ::::::::::  -->
    
</head>

<body>
    <!-- :::::::::: Start Header Section :::::::::: -->
    <app-header></app-header>

    <!-- :::::::::: Start Breadcomb Section :::::::::: -->
    <div id="breadcrumb-section">
        <div class="container-fluid p-lr-80">
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="breadcrumb-title">Page de contact</h2>
                    <nav aria-label="breadcrumb">
                       
                    </nav>
                </div>
            </div>
        </div>
    </div> <!-- :::::::::: End Breadcomb Section :::::::::: -->

    <!-- :::::::::: Start Contact Section :::::::::: -->
    <div id="contact-section">
        <div class="container-fluid p-lr-80">
            <div class="row">
                <div class="col-lg-8 col-md-12">
                    <div class="contact-form mt-30">
                        <h4 class="title-tertiary text-uppercase">ENTRER EN CONTACT</h4>
                        <form (ngSubmit)="addNewContact()" [formGroup]="adminForm" class="row g-3">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="single-form">
                                        <input formControlName="nom" type="text"  placeholder="Votre Nom">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="single-form">
                                        <input formControlName="email" type="email"  placeholder="Votre Email">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="single-form">
                                        <input formControlName="tele" type="text"  placeholder="Votre Numéro Téléphone">
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="single-form">
                                        <input formControlName="sujet" type="text"  placeholder="Sujet">
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="single-form">
                                        <textarea formControlName="mes"  placeholder="Votre Message"></textarea>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="single-form">
                                        <button class="box-btn" type="submit">Envoyer Message</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
                <div class="col-lg-4 col-md-12">
                    <!--  Start Sidebar Box  -->
                    <div class="sidebar-box contact-info-box">
                        <h4 class="sidebar-title">Contactez-nous</h4>
                        <div class="contact-info">
                            <div class="contact-info__icon">
                                <i class="far fa-map"></i>
                            </div>
                            <div class="contact-info__content">
                                <h6 class="contact-info__content--label">Localisation :</h6>
                                <div class="contact-info__content--info">
                                    <span> Lac 2, Av.Taieb Mhiri.</span>
                                </div>
                            </div>
                        </div>
                        <div class="contact-info">
                            <div class="contact-info__icon">
                                <i class="far fa-envelope"></i>
                            </div>
                            <div class="contact-info__content">
                                <h6 class="contact-info__content--label">Mail :</h6>
                                <div class="contact-info__content--info">
                                    <span>liora@gmail.com</span>
                                </div>
                            </div>
                        </div>
                        <div class="contact-info">
                            <div class="contact-info__icon">
                                <i class="fas fa-phone-alt"></i>
                            </div>
                            <div class="contact-info__content">
                                <h6 class="contact-info__content--label">Téléphone :</h6>
                                <div class="contact-info__content--info">
                                    <span>71 208 354</span>
                                </div>
                            </div>
                        </div>
                    </div> <!--  End Sidebar Box  -->
                </div>
            </div>
        </div>
    </div> <!-- :::::::::: End Contact Section :::::::::: -->

    <!-- :::::::::: Start Footer Section :::::::::: -->
    <!-- :::::::::: End Footer Section :::::::::: -->
    <app-footer></app-footer>
    <!-- material-scrolltop button -->
    <button class="material-scrolltop" type="button"></button>

    <!-- :::::::::: Javascript Files, jQuery Vendor Plugins ::::::::::  -->
   
</body>

</html>
