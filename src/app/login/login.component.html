<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavir | Responsive eCommerce HTML Template</title>

    
</head>

<body>

    <!-- :::::::::: Start Header Section :::::::::: -->
    

    <!-- :::::::::: Start Breadcomb Section :::::::::: -->
    <div id="breadcrumb-section">
        <div class="container-fluid p-lr-80">
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="breadcrumb-title">Page de connexion</h2>
                    
                </div>
            </div>
        </div>
    </div> <!-- :::::::::: End Breadcomb Section :::::::::: -->

    <!-- :::::::::: Start Login Section :::::::::: -->
    <div class="login-area">
        <div class="container-fluid custom-container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="login-register-wrapper">
                        <h4 class="allup-title">Connectez-vous à votre compte</h4>
                        <form (ngSubmit)="login()" [formGroup]="loginForm">
                            <div class="single-form">
                                <input formControlName="email" type="text" placeholder="Votre email ">
                            </div>
                            <div class="single-form">
                                <input formControlName="mdp" type="password" placeholder="Mot De Passe">
                            </div>
                            
                            <div class="single-form">
                                <button class="box-btn" type="submit">Se connecter</button>
                            </div>
                        </form>
                        <p class="m-t-20"><a href="#">Mot de passe oublié!</a></p>
                        <p class="m-t-10">Pas de compte ? <a href="/register">Créez-en un ici.</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div><!-- :::::::::: Start Login Section :::::::::: -->

    <!-- :::::::::: Start Footer Section :::::::::: -->
    

    <!-- material-scrolltop button -->
    <button class="material-scrolltop" type="button"></button>

    <!-- :::::::::: Javascript Files, jQuery Vendor Plugins ::::::::::  -->
  
</body>
